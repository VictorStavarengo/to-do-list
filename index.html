<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas Avançada</title>
    <meta
        name="description"
        content="Lista de tarefas com filtros, prioridades, ordenação por horário e modo escuro. Sem framework, só HTML, CSS e JavaScript."
    >
    <link rel="canonical" href="https://victorstavarengo.github.io/to-do-list/">

    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:site_name" content="Lista de Tarefas">
    <meta property="og:url" content="https://victorstavarengo.github.io/to-do-list/">
    <meta property="og:title" content="Lista de Tarefas · HTML, CSS e JavaScript">
    <meta
        property="og:description"
        content="Filtros, prioridades, ordenação por horário e modo escuro. Sem framework, só HTML, CSS e JavaScript."
    >
    <meta
        property="og:image"
        content="https://victorstavarengo.github.io/to-do-list/docs/tema-claro.png"
    >
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1894">
    <meta property="og:image:height" content="951">
    <meta property="og:image:alt" content="Lista de Tarefas — tema claro">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Lista de Tarefas · HTML, CSS e JavaScript">
    <meta
        name="twitter:description"
        content="Filtros, prioridades, ordenação por horário e modo escuro. Sem framework, só HTML, CSS e JavaScript."
    >
    <meta
        name="twitter:image"
        content="https://victorstavarengo.github.io/to-do-list/docs/tema-claro.png"
    >
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Favicon - um ícone de lista de tarefas simples -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23007bff' d='M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z'/></svg>" type="image/svg+xml">
</head>
<body>
    <div class="container">
        <div class="header-section">
            <h1>Minha Lista de Tarefas</h1>
            <button id="dark-mode-toggle" title="Alternar Modo Escuro">
                <i class="fas fa-moon"></i>
            </button>
        </div>

        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Adicionar nova tarefa..." required>
            <input type="time" id="todo-time" value="09:00">
            <select id="todo-importance">
                <option value="baixa">Baixa</option>
                <option value="media" selected>Média</option>
                <option value="alta">Alta</option>
            </select>
            <button type="submit">Adicionar</button>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="active">Ativas</button>
            <button class="filter-btn" data-filter="completed">Concluídas</button>
        </div>

        <div class="sort-options">
            <button class="sort-btn active" data-sort="default">Ordem Padrão</button>
            <button class="sort-btn" data-sort="time">Horário</button>
            <button class="sort-btn" data-sort="importance">Importância</button>
        </div>

        <button id="clear-completed-btn" class="action-btn">
            <i class="fas fa-eraser"></i> Limpar Concluídas
        </button>

        <div class="task-summary">
            <span id="active-tasks-count"></span> | <span id="completed-tasks-count"></span>
        </div>

        <p id="empty-list-message" class="hidden">Nenhuma tarefa aqui ainda! Adicione uma nova.</p>

        <ul id="todo-list">
            <!-- As tarefas serão adicionadas aqui via JavaScript -->
        </ul>
    </div>

    <!-- NOVO: Modal de Confirmação -->
    <div id="confirmation-modal" class="modal hidden">
        <div class="modal-content">
            <p id="modal-message">Tem certeza que deseja excluir esta tarefa?</p>
            <div class="modal-buttons">
                <button id="modal-confirm-btn" class="confirm-btn">Confirmar</button>
                <button id="modal-cancel-btn" class="cancel-btn">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- NOVO: Contêiner para Toast Notifications -->
    <div id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
